_subdirectory: template

tenant:
  type: str
  help: "Tenant slug (URL-friendly)"
  placeholder: "acme-corp"
name:
  type: str
  help: "App name (for package.json)"
  placeholder: "@acme-corp/foo"
profile:
  type: str
  help: "App contract profile (§ 5.2 PLX): the module the app declares, PLX-Stateless or PLX-Stateful"
  choices:
    - stateless-app
    - stateful-app
  default: stateless-app
